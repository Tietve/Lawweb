name = "lawbot-scheduler"
main = "src/index.ts"
compatibility_date = "2025-11-15"
workers_dev = true

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "lawbot-db"
database_id = "${D1_DATABASE_ID}"

# Vectorize binding for periodic index updates
[[vectorize]]
binding = "VECTORIZE"
index_name = "legal-docs-index"

# R2 Storage for backups
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "lawbot-backups"

# Cron triggers
[triggers]
crons = [
  "0 0 * * *",     # Daily at midnight - cleanup old sessions
  "0 */6 * * *",   # Every 6 hours - update vector index
  "0 3 * * 0"      # Weekly on Sunday at 3 AM - database backup
]

# Environment variables
[vars]
ENVIRONMENT = "development"

# Rate limiting
[limits]
cpu_ms = 50
