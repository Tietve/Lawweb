name = "lawbot-api"
main = "src/index.ts"
compatibility_date = "2025-11-15"
workers_dev = true

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "lawbot-db"
database_id = "${D1_DATABASE_ID}"

# Vectorize binding for search
[[vectorize]]
binding = "VECTORIZE"
index_name = "legal-docs-index"

# R2 Storage for uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "lawbot-uploads"

# KV for API rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "${KV_RATE_LIMIT_NAMESPACE_ID}"

# Service bindings
[[services]]
binding = "CHATBOT"
service = "lawbot-chatbot"

# Environment variables
[vars]
ENVIRONMENT = "development"
JWT_SECRET = "${JWT_SECRET}"
CLAUDE_API_KEY = "${CLAUDE_API_KEY}"
CORS_ORIGIN = "http://localhost:3000"

# Rate limiting
[limits]
cpu_ms = 50
