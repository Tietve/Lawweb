name = "lawbot-api"
main = "src/index.ts"
compatibility_date = "2025-11-15"
workers_dev = true

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "lawbot-db"
database_id = "${D1_DATABASE_ID}"

# Vectorize binding for semantic search
[[vectorize]]
binding = "VECTORIZE"
index_name = "legal-docs-index"

# R2 Storage for uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "lawbot-uploads"

# KV for API rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "${KV_RATE_LIMIT_NAMESPACE_ID}"

# Queue for webhook processing
[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "lawbot-webhooks"

# Durable Object for real-time analytics
[[durable_objects.bindings]]
name = "ANALYTICS"
class_name = "AnalyticsCounter"
script_name = "lawbot-analytics"

# Service binding to chatbot worker
[[services]]
binding = "CHATBOT"
service = "lawbot-chatbot"

# Environment variables
[vars]
ENVIRONMENT = "development"
CORS_ORIGIN = "http://localhost:3000"

# Secrets (set via wrangler secret put)
# JWT_SECRET - JWT signing secret
# CLAUDE_API_KEY - Anthropic Claude API key
# ZALO_APP_SECRET - Zalo OA app secret
# FB_APP_SECRET - Facebook app secret
# FB_VERIFY_TOKEN - Facebook webhook verify token

# Performance limits
[limits]
cpu_ms = 50
